<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyBank | Secure Login</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="login-page">

    <div class="demo-banner">
         SMARTEST BANKING IN ASIA
    </div>

    <main class="login-container">

        <div class="login-brand">

            <div class="brand-icon">M</div>

            <div>
                <h1>MyBank</h1>
                <p>Digital Banking Experience</p>
            </div>

        </div>


        <div class="login-card">

            <div class="welcome">

                <h2>Welcome back!</h2>

                <p>
                    Sign in to access your account.
                </p>

            </div>


            <form id="loginForm">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    autocomplete="username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <p id="loginError" class="error-message"></p>


                <button type="submit" class="primary-btn">
                    Log in
                </button>

            </form>


            <div class="demo-credentials">

                <strong>Forgot user id?</strong>

                <p>Contact our Customer Service: mybank@gmail.com</p>

            </div>

        </div>


        <p class="footer-note">
            MyBank is a fictional banking interface.
            No real financial accounts or banking services are connected.
        </p>

    </main>


    <script src="script.js"></script>

</body>
</html>
